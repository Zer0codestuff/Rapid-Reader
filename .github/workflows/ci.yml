name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: SwiftPM Tests
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        # The redesign needs the macOS 26 SDK (Liquid Glass APIs).
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [[ -n "$XCODE" ]]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Test
        run: swift test

      - name: Package universal release DMG
        run: ./script/package_dmg.sh "0.0.0-ci.${{ github.run_number }}"

      - name: Check architectures and version
        run: |
          lipo -archs "dist/Rapid Reader.app/Contents/MacOS/RapidReader" | grep -q "x86_64 arm64"
          plutil -extract CFBundleShortVersionString raw "dist/Rapid Reader.app/Contents/Info.plist"

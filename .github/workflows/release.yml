name: Release

# Pushing a tag such as v1.1.0 builds the DMG and attaches it to a draft release.
# The owner reviews and publishes the draft manually.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to package, without the leading v
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Select Xcode
        # The redesign needs the macOS 26 SDK (Liquid Glass APIs).
        run: |
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [[ -n "$XCODE" ]]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Test
        run: swift test

      - name: Package DMG
        env:
          # Repository variable with the base64 EdDSA public key; updates stay disabled without it.
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: ./script/package_dmg.sh "${{ steps.version.outputs.value }}"

      - name: Generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo "SPARKLE_PRIVATE_KEY is not set; skipping appcast."
            exit 0
          fi
          KEY_FILE="$RUNNER_TEMP/sparkle.key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          SPARKLE_PRIVATE_KEY_FILE="$KEY_FILE" ./script/make_appcast.sh "${{ steps.version.outputs.value }}"
          rm -f "$KEY_FILE"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RapidReader-${{ steps.version.outputs.value }}
          path: build/package/RapidReader-${{ steps.version.outputs.value }}.dmg

      - name: Create draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=("build/package/RapidReader-${{ steps.version.outputs.value }}.dmg")
          if [[ -f build/appcast/appcast.xml ]]; then ASSETS+=(build/appcast/appcast.xml); fi
          gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" \
            --draft --title "Rapid Reader ${{ steps.version.outputs.value }}" --generate-notes
